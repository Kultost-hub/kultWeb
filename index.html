function checkLive() {
    let input = document.getElementById('liveInput').value.trim().toLowerCase();
    let block = document.getElementById('liveBlock');
    
    if (input === "секрет") {
        block.style.display = 'block';
        block.style.color = 'red';
    } else {
        block.style.display = 'none'; // Скрываем блок, если слово стерли или изменили

}
